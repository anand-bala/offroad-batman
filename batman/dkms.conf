PACKAGE_NAME="batman-adv"

# Track the upstream release the batman-adv submodule is pinned to. Bump this
# and the submodule tag together; DKMS keys its /usr/src tree on the pair, so a
# mismatch leaves stale sources installed under the old version.
PACKAGE_VERSION="2026.2"

# Upstream ships a Makefile but no dkms.conf -- Debian's packaging supplies one,
# which is why there is no batman-adv-dkms in noble to install instead. This is
# that missing file.
#
# The out-of-tree build is driven entirely by KERNELPATH (README.external.rst);
# there is no separate configure step. Note upstream's warning that any options
# passed to `make` must be repeated on `make install` -- irrelevant here only
# because DKMS installs the built module itself rather than calling that target.
MAKE[0]="make -j$(nproc) KERNELPATH=${kernel_source_dir}"
CLEAN="make clean"

BUILT_MODULE_NAME[0]="batman-adv"
BUILT_MODULE_LOCATION[0]="net/batman-adv"
DEST_MODULE_LOCATION[0]="/updates/net/batman-adv"

AUTOINSTALL="yes"
