[project]
name = "offroad-batman"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [{ name = "Anand Balakrishnan", email = "anandbala1597@gmail.com" }]
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.100",
    "httpx>=0.24",
    "numpy>=1.24",
    "pydantic>=2.0",
    "python-multipart>=0.0.6",
    "uvicorn>=0.23",
]

[project.scripts]
offroad-batman-jobs = "offroad_batman.jobs.cli:main"

[dependency-groups]
dev = [
    "mypy>=1.8",
    "pytest>=7.4",
    "ruff>=0.6",
    "zuban>=0.9.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.10"
disallow_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_return_any = true
warn_unused_ignores = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
