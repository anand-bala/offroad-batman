# Turn on the mDNS responder + resolver globally so <hostname>.local is both
# advertised and resolvable. Per-link opt-in is set with MulticastDNS=yes in
# 25-bat0.network; this global switch is what enables the responder side.
#
# NOTE: Also confirm /etc/nsswitch.conf has a "hosts:" line that routes through
# systemd-resolved, e.g.:
#   hosts: files resolve [!UNAVAIL=return] dns
# so that .local lookups reach resolved's mDNS.


[Resolve]
MulticastDNS=yes
