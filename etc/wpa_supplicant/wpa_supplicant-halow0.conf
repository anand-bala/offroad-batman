# IBSS bring-up for the S1G radio (Morse wpa_supplicant fork, wpa_supplicant_s1g).
#
# ssid / channel / op_class / country are FLEET-COMMON -- identical on every
# node. Only per-node addressing (in 25-bat0.network) differs.
#
# ####################  SECURITY DECISION (still open)  ################
# This file is the ONLY thing that changes between an open and an encrypted
# mesh. Pick one:
#   * Open IBSS  -> key_mgmt=NONE  (active below)
#   * RSN-IBSS   -> comment key_mgmt=NONE, uncomment the RSN block, set a long
#                   random PSK: openssl rand -base64 24 . No SAE for IBSS.
# If you only want confidentiality (not access control), consider leaving this
# open and running WireGuard over bat0 instead.
#
# chmod 600 this file (it may hold a PSK) and keep it root-owned.
# #####################################################################

country=US
ctrl_interface=/run/wpa_supplicant_s1g
ap_scan=2

network={
        ssid="HaLow-Mesh"
        mode=1

        # S1G channel/op_class per the Gateworks table (1 MHz @ ~918.5 MHz --
        # best link budget; widen only once peering is proven). These are the
        # Morse fork's keys; if the supplicant rejects them for IBSS, replace
        # both lines with the mapped frequency, e.g.:  frequency=5175
        channel=33
        op_class=68

        country="US"
        beacon_int=1000

        key_mgmt=NONE

        # ---- RSN-IBSS alternative (comment out key_mgmt=NONE above) ----
        # key_mgmt=WPA-PSK
        # proto=RSN
        # pairwise=CCMP
        # group=CCMP
        # psk="REPLACE-WITH-openssl-rand-base64-24"
}

