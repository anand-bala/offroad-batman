# Clock discipline for a mesh node.
#
# Installed by install_network_stack.sh, which stamps the `server` line below
# with the gateway's derived mesh address. A drop-in rather than a replacement
# for chrony.conf, so the distro's own defaults (drift file, rtcsync, the
# leap-second table) survive an upgrade.
#
# WHY THIS EXISTS AT ALL
#
# Measurements taken on different nodes are only joinable if their timestamps
# mean the same thing. `batman_oracle.sh soak` refuses to log until chrony says
# this node is synced, precisely so that a long run cannot quietly produce a
# pile of CSVs that can never be lined up against each other.
#
# The transport is a non-issue: bat0 is an ordinary L3 interface, NTP is
# unicast UDP/123, and because the mesh is one L2 segment every node shares a
# subnet. What has to be designed is authority and the epoch jump.

# The one authoritative source: the gateway, which is the only node with an
# uplink and therefore the only one that can know the real time. Address is
# stamped in at install time -- derived from the roster like every other
# address, so a ULA_PREFIX change moves it with the fleet.
#
# minpoll/maxpoll are tighter than chrony's defaults (16-64 s rather than
# 64-1024 s). Normally that would be wasteful, but the exchange is a handful of
# small packets and converging quickly matters more here than the airtime: a
# node that has just booted at the epoch is useless for logging until it steps.
server GATEWAY_ADDRESS_PLACEHOLDER iburst minpoll 4 maxpoll 6

# THE EPOCH PROBLEM.
#
# By default chrony steps the clock only for its first few updates and slews
# (gradually corrects) after that. Slewing a 56-year offset would never finish.
# `makestep 1 -1` means "step whenever the offset exceeds 1 s, with no limit on
# how many times", so a node that boots at 1970 -- or drops out of the mesh and
# rejoins hours later -- jumps straight to the correct time instead of crawling
# toward it for the rest of the deployment.
#
# The cost is that the wall clock can jump BACKWARD at any time. That is why
# anything measuring a duration must use CLOCK_MONOTONIC (ROS: steady time),
# and why wall-clock time is used here only for cross-node timestamps, which is
# exactly and only what the oracle does with it.
makestep 1 -1

# Accept commands from the local host only. The mesh is reachable from a
# kilometre away by anyone with a HaLow radio, and nothing on it should be able
# to retune this node's clock.
cmdport 323
bindcmdaddress 127.0.0.1
bindcmdaddress ::1

# This node serves time to nobody. Only the gateway does, and it runs OpenWrt
# with its own configuration -- see docs/OPENWRT.md.
port 0
