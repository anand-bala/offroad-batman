# Load at boot. batman-adv is in-tree and loads on demand when the bat0 netdev
# is created, but loading it here too is harmless and explicit.
#
# morse is out-of-tree, staged by build_dependencies.sh via DKMS. That runs
# depmod, so the USB modalias should autoload it when the radio is plugged in
# and this line is usually redundant -- but loading an already-loaded module is
# a no-op that returns success, so the redundancy is free, and it removes a
# silent dependency on the modalias table being correct after every DKMS
# rebuild. The installer's preflight refuses to run without the module, so a
# name listed here always resolves.
batman-adv
morse
