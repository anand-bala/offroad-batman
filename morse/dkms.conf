PACKAGE_NAME="morse"
PACKAGE_VERSION="2.0.0"

# The driver sources live in the morse_driver submodule of this tree, so every
# make invocation is run with -C morse_driver. Kbuild descends into dot11ah/
# on its own (obj-$(CONFIG_WLAN_VENDOR_MORSE) += morse.o dot11ah/), so both
# modules come out of the single build.
#
# Local fixups to the vendor tree. DKMS resolves these against the patches/
# subdirectory of this source tree and applies them with `patch -p1` from the
# root of a *fresh* copy on every build, so the vendor submodule in the git
# checkout stays pristine and a kernel-upgrade rebuild re-patches by itself.
PATCH[0]="0001-make-morse-version-overridable.patch"

# Firmware and BCFs go in alongside the modules. This runs on first install and
# again on every kernel-upgrade autoinstall; the hook is idempotent, so the
# re-run just means the firmware repairs itself if anything clobbers it.
#
# There is deliberately no matching POST_REMOVE: DKMS removals are per-kernel
# (`dkms remove -k <old-kernel>` during routine kernel cleanup), and dropping
# the firmware there would break the module still installed for the running
# kernel. Uninstall via `morse_micro_install.sh --uninstall`.
POST_INSTALL="install-firmware.sh"

# MORSE_VERSION depends on PATCH[0] above -- upstream pins it with `override`, which
# discards command-line values. It must start with a digit to satisfy the kernel's
# module version expectations.
MORSE_MAKE_ARGS="KERNEL_SRC=${kernel_source_dir} \
  MORSE_VERSION=0-mm8108-2.0.0-dkms \
  CONFIG_MORSE_USB=y \
  CONFIG_MORSE_USER_ACCESS=y \
  CONFIG_MORSE_VENDOR_COMMAND=y \
  CONFIG_MORSE_POWERSAVE_MODE=0 \
  CONFIG_MORSE_COUNTRY=US \
  CONFIG_MORSE_RC=y \
  CONFIG_MORSE_MONITOR=y \
  CONFIG_MORSE_DEBUGFS=y \
  CONFIG_WLAN_VENDOR_MORSE=m \
  KCFLAGS=-Wno-error=implicit-function-declaration"

MAKE[0]="make -j$(nproc) -C morse_driver ${MORSE_MAKE_ARGS}"
CLEAN="make -C morse_driver clean"

BUILT_MODULE_NAME[0]="morse"
BUILT_MODULE_LOCATION[0]="morse_driver"
DEST_MODULE_LOCATION[0]="/updates/net/wireless/morse"

BUILT_MODULE_NAME[1]="dot11ah"
BUILT_MODULE_LOCATION[1]="morse_driver/dot11ah"
DEST_MODULE_LOCATION[1]="/updates/net/wireless/morse"

AUTOINSTALL="yes"
